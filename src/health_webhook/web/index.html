<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>健康</title>
    <link rel="stylesheet" href="/static/vendor/uPlot.min.css" />
    <link rel="stylesheet" href="/static/style.css" />
    <script defer src="/static/vendor/uPlot.iife.min.js"></script>
    <script defer src="/static/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="健康首页">
        <span class="brand-icon">♥</span><b>健康</b>
      </a>
    </header>
    <main>
      <p id="sync-status" class="subtitle" role="status">正在读取记录…</p>
      <p id="error" role="alert" hidden></p>
      <div id="dashboard" hidden>
        <section class="summary" aria-label="健康指标概览">
          <article class="metric">
            <div class="metric-title">❤️ 心率</div>
            <div class="metric-value">
              <span id="card-heart_rate">—</span><small>次/分</small>
            </div>
            <div class="metric-bottom">
              <small>范围</small><span id="card-heart_rate-range">—</span>
            </div>
          </article>
          <article class="metric">
            <div class="metric-title">💓 HRV</div>
            <div class="metric-value">
              <span id="card-hrv">—</span><small>ms</small>
            </div>
            <div class="metric-bottom">
              <small>样本</small><span id="card-hrv-count">—</span>
            </div>
          </article>
          <article class="metric">
            <div class="metric-title">🫁 血氧</div>
            <div class="metric-value">
              <span id="card-oxygen">—</span><small>%</small>
            </div>
            <div class="metric-bottom">
              <small>最近</small><span id="card-oxygen-time">—</span>
            </div>
          </article>
          <article class="metric">
            <div class="metric-title">🚶 步数</div>
            <div class="metric-value">
              <span id="card-steps">—</span><small>步</small>
            </div>
            <div class="metric-bottom">
              <small>样本</small><span id="card-steps-count">—</span>
            </div>
          </article>
          <article class="metric">
            <div class="metric-title">🔥 活动能量</div>
            <div class="metric-value">
              <span id="card-active_energy">—</span><small>kcal</small>
            </div>
            <div class="metric-bottom">
              <small>样本</small><span id="card-active_energy-count">—</span>
            </div>
          </article>
        </section>
        <section class="panel">
          <div class="panel-heading">
            <div>
              <h2>心率变化</h2>
              <p class="fine" id="hr-caption"></p>
            </div>
          </div>
          <div id="heart-rate-chart" class="chart" role="img" aria-label="心率趋势曲线"></div>
        </section>
        <section class="panel records">
          <div class="panel-heading">
            <div><h2>最近记录</h2></div>
          </div>
          <p class="records-note" id="record-summary" aria-live="polite"></p>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>时间 · 北京时间</th>
                  <th>指标</th>
                  <th>数值</th>
                  <th>来源</th>
                </tr>
              </thead>
              <tbody id="record-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
