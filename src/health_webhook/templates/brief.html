<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>健康简报</title>
<style>
:root{--ink:#263b38;--muted:#687975;--line:#dce4dd;--green:#275e4d;--paper:#fffefa;--wash:#f0f3ec;--amber:#856139}
*{box-sizing:border-box}body{margin:0;background:#e9ede6;color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.8}main{max-width:940px;margin:38px auto;background:var(--paper);padding:48px 60px 32px;border:1px solid var(--line);box-shadow:0 12px 45px #253b3810}header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--green);font-weight:700}h1{font-size:34px;letter-spacing:2px;line-height:1.4;margin:7px 0 5px}p{margin:0}.date{color:var(--muted);font-size:13px}.badge{display:inline-block;border:1px solid #c7d4c9;border-radius:30px;padding:3px 12px;color:var(--muted);font-size:12px}.actions{text-align:right}button{display:block;margin:10px 0 0 auto;border:0;background:transparent;color:var(--green);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:4px}.lead{margin:25px 0 27px;padding:22px 25px;background:var(--wash);border-left:3px solid var(--green)}.label{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--green)}h2{font-size:23px;line-height:1.5;margin:5px 0 9px;font-weight:650}.lead p{font-size:14px;color:#52655f}.section-head{display:flex;justify-content:space-between;gap:15px;align-items:baseline;margin-bottom:12px}h3{font-size:16px;margin:0}.small{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}th{font-weight:400;font-size:12px;color:var(--muted);padding-top:0}td:nth-child(2){font-weight:700;color:var(--green);font-size:17px}td:nth-child(3){color:var(--muted)}td:last-child{white-space:nowrap}th:first-child,td:first-child{padding-left:0}sup{font-size:10px;color:var(--muted)}.columns{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin:28px 0}.insight h3{margin-bottom:8px}.insight p{font-size:14px;color:#52655f}.index{font-size:12px;font-weight:400;color:#83978b;margin-right:8px}.next{display:flex;gap:22px;background:#faf4e9;border:1px solid #e9dfcb;border-radius:4px;padding:20px 23px;margin-bottom:26px}.next .label{color:var(--amber);white-space:nowrap;padding-top:2px}.next p{font-size:14px}.next strong{color:#6d5131}details{border-top:1px solid var(--line);padding:15px 0 0;font-size:12px;color:var(--muted)}summary{cursor:pointer;color:#53675e}details ol{padding-left:20px;margin-bottom:8px}details li{padding:4px 0}a{color:var(--green);text-underline-offset:3px}.footer{display:flex;justify-content:space-between;gap:20px;margin-top:22px;font-size:11px;color:#839087}.note{font-size:12px;color:var(--muted);margin-top:10px}
@media(max-width:640px){body{background:var(--paper)}main{margin:0;padding:26px 20px;border:0;box-shadow:none}h1{font-size:29px}.lead{padding:18px}h2{font-size:21px}.section-head{display:block}.columns{grid-template-columns:1fr;gap:20px;margin:23px 0}th,td{padding:11px 4px;font-size:12px}td:nth-child(2){font-size:14px}th{font-size:11px}.next{display:block;padding:18px}.next .label{margin-bottom:8px}.footer{display:block}.badge{white-space:nowrap}}
@media print{@page{size:A4;margin:13mm}body{background:white;font-size:12px}main{max-width:none;margin:0;padding:0;border:0;box-shadow:none}.actions button{display:none}header{padding-bottom:14px}.lead{margin:18px 0;padding:15px 20px}.columns{margin:20px 0;gap:24px}.next{margin-bottom:16px;padding:14px 18px}th,td{padding-top:8px;padding-bottom:8px}h1{font-size:28px}h2{font-size:20px}.lead,.next,table,.insight{break-inside:avoid}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.footer{margin-top:12px}}

.sleep-panel,.vitals-panel{margin:27px 0;padding:24px;background:#f6f7f2;border:1px solid var(--line);border-radius:5px}.sleep-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:18px 0}.sleep-grid span{display:block;font-size:12px;color:var(--muted)}.sleep-grid strong{font-size:25px;font-weight:600;color:var(--green)}.sleep-grid small{font-size:12px;font-weight:400}.stage-bar{display:flex;height:12px;border-radius:5px;overflow:hidden;margin:12px 0 8px}.stage-key{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:12px;color:var(--muted)}.stage-key b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}.sleep-chart{display:flex;align-items:flex-end;gap:12px;height:148px;margin-top:20px;border-bottom:1px solid var(--line)}.chart-col{flex:1;text-align:center;min-width:0}.chart-col i{display:block;background:#b9cbbc;border-radius:3px 3px 0 0;width:65%;margin:5px auto 0}.chart-col:last-child i{background:var(--green)}.chart-col span{font-size:10px;color:var(--muted)}.chart-labels{display:flex;gap:12px;text-align:center;font-size:11px;color:var(--muted);margin-top:5px}.chart-labels span{flex:1}.subhead{font-size:13px;margin-top:20px}.vitals-panel{background:transparent}.vitals-panel table{margin-top:17px}.longterm{border-top:1px solid var(--line);padding-top:17px;margin:18px 0 24px;font-size:13px;color:var(--muted)}
@media(max-width:640px){.sleep-panel,.vitals-panel{padding:16px}.sleep-grid{grid-template-columns:repeat(2,1fr)}.sleep-chart,.chart-labels{gap:4px}.sleep-grid strong{font-size:24px}.vitals-panel td:nth-child(2){font-size:13px}.vitals-panel td:last-child{white-space:normal}}
@media print{.sleep-panel,.vitals-panel{break-inside:avoid;padding:16px;margin:18px 0}.sleep-chart{height:135px}.sleep-grid{margin:10px 0}.sleep-grid strong{font-size:22px}}
</style>

  --drop-shadow-2xl: 0 25px 25px rgb(0 0 0 / 0.15);

    0px 1px 1px rgb(0 0 0 / 0.1), 0px 1px 2px rgb(0 0 0 / 0.1), 0px 2px 4px rgb(0 0 0 / 0.1);

    0px 1px 2px rgb(0 0 0 / 0.1), 0px 3px 2px rgb(0 0 0 / 0.1), 0px 4px 8px rgb(0 0 0 / 0.1);

  --ease-in: cubic-bezier(0.4, 0, 1, 1);
  --ease-out: cubic-bezier(0, 0, 0.2, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);

  --animate-spin: spin 1s linear infinite;
  --animate-ping: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;
  --animate-pulse: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  --animate-bounce: bounce 1s infinite;

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes ping {
    75%,
    100% {
      transform: scale(2);
      opacity: 0;
    }
  }

  @keyframes pulse {
    50% {
      opacity: 0.5;
    }
  }

  @keyframes bounce {
    0%,
    100% {
      transform: translateY(-25%);
      animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
    }

    50% {
      transform: none;
      animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
    }
  }
